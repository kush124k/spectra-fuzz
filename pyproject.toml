[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectra-fuzz"
version = "0.1.0"
description = "LLM-augmented differential fuzzer combining AFL++ with Google Gemini"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "spectra-fuzz contributors" }]

dependencies = [
    "click>=8.1",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tomli>=2.0; python_version < '3.12'",
    "tomli-w>=1.0",
    "rich>=13.7",
    "aiofiles>=24.1",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
spectra = "spectra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# BLE001: Blind exception catches are intentional — we wrap unpredictable
#         subprocesses (AFL++), LLM API calls, and crash reproduction.
# SIM102: Nested ifs are sometimes more readable than combined conditions.
# RUF012: Mutable class-level defaults are fine for constant lookup tables.
# F823/F841: False positives on closure-scoped variables in async FastAPI.
ignore = ["BLE001", "SIM102", "RUF012", "F823", "F841"]
